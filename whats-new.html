<div class="wn-wrap">
  <div id="wn-list"></div>
  <button class="wn-more hidden" id="wn-more">Show full history</button>
</div>
<script>
(function () {
  var SHOW = 30;
  fetch("/release-notes.json").then(function (r) { return r.json(); }).then(function (d) {
    var list = document.getElementById("wn-list");
    var more = document.getElementById("wn-more");
    var versions = (d && d.versions) || [];
    function fmtDate(s) {
      try {
        var p = s.split("-");
        return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      } catch (e) { return s; }
    }
    function render(n) {
      list.innerHTML = "";
      versions.slice(0, n).forEach(function (v) {
        var row = document.createElement("div");
        row.className = "wn-row";
        var pill = document.createElement("span");
        pill.className = "wn-pill";
        pill.textContent = "v" + v.version;
        var right = document.createElement("span");
        right.style.flex = "1";
        var note = document.createElement("span");
        note.className = "wn-note";
        note.textContent = v.notes || "";
        var date = document.createElement("span");
        date.className = "wn-date";
        date.textContent = fmtDate(v.date || "");
        right.appendChild(note); right.appendChild(date);
        row.appendChild(pill); row.appendChild(right);
        list.appendChild(row);
      });
    }
    render(SHOW);
    if (versions.length > SHOW) {
      more.classList.remove("hidden");
      more.textContent = "Show full history (" + versions.length + " releases)";
      more.addEventListener("click", function () { render(versions.length); more.classList.add("hidden"); });
    }
  }).catch(function () {
    document.getElementById("wn-list").innerHTML = '<div class="wn-note" style="text-align:center;">Release notes are taking a break - try a refresh.</div>';
  });
})();
</script>
