<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're invited — PPC Cards</title>
<meta name="description" content="A friend invited you to play PPC Cards — OFC poker, Palace, Rummy, Scala 40, Hearts and Solitaire. Crossplay on iOS, Android and PC." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#16181c" />
<meta property="og:title" content="Play PPC Cards with me" />
<meta property="og:description" content="A friend invited you to PPC Cards. Join free on iOS, Android, or in your browser." />
<meta property="og:image" content="https://ppc.casino/og-image.png" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  :root { --gold:#f3d58b; --gold-deep:#d9a441; --bg:#16181c; --panel:#23262d; --muted:#aab1ad; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    background: linear-gradient(135deg, #1b1e23 0%, #131519 100%);
    color:#fff; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:28px 22px; text-align:center;
  }
  .mark { display:flex; gap:3px; flex-wrap:wrap; width:64px; justify-content:center; margin-bottom:18px; }
  .mark i { width:11px; height:14px; background:var(--gold); border-radius:2px; }
  .brand { font-weight:800; font-size:13px; letter-spacing:.28em; color:#fff; margin-bottom:26px; }
  .hi { color:var(--muted); font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  h1 { font-size:24px; font-weight:800; letter-spacing:.02em; margin:8px 0 4px; }
  .code { font-family:Georgia,serif; color:var(--gold); font-size:16px; letter-spacing:.22em; margin-bottom:26px; }
  .cta { width:100%; max-width:320px; display:block; border:none; border-radius:13px; padding:15px;
    font-weight:800; font-size:15px; letter-spacing:.04em; text-transform:uppercase; text-decoration:none;
    cursor:pointer; margin-bottom:12px; }
  .cta-primary { background:linear-gradient(180deg,var(--gold),var(--gold-deep)); color:#16181c; }
  .cta-secondary { background:transparent; border:1px solid #3a3f48; color:#cfd3d9; font-weight:600; font-size:13px; }
  .foot { color:#7C8A83; font-size:11px; line-height:1.6; margin-top:18px; max-width:300px; }
  .games { color:#7C8A83; font-size:11px; letter-spacing:.12em; margin-top:24px; }
</style>
</head>
<body>
  <div class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="brand">PPC CARDS</div>
  <div class="hi">You're invited</div>
  <h1>Play cards together</h1>
  <div class="code" id="code"></div>

  <a class="cta cta-primary" id="primary" href="#">Play Now</a>
  <a class="cta cta-secondary" id="secondary" href="#" style="display:none;">Play in browser</a>

  <div class="foot">Free to play. When you sign in, you'll be added as a friend automatically — on iPhone, Android, or the web.</div>
  <div class="games">OFC · Hearts · Palace · Rummy · Scala 40 · Solitaire</div>

<script>
  (function () {
    // Code is the last path segment of /i/<code> (with a ?c= fallback).
    var code = "";
    try {
      var parts = location.pathname.split("/").filter(Boolean);
      code = decodeURIComponent(parts[parts.length - 1] || "");
      if (!code || code.toLowerCase() === "i") {
        code = new URLSearchParams(location.search).get("c") || "";
      }
    } catch (e) {}
    var safe = code.replace(/[^A-Za-z0-9\-]/g, "");
    if (safe) document.getElementById("code").textContent = "Code " + safe;

    var webUrl = "https://ofc.ppc.casino/" + (safe ? "?ref=" + encodeURIComponent(safe) : "");
    var appStore = "https://apps.apple.com/app/id6778567066";
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Mac/i.test(ua) && navigator.maxTouchPoints > 1);

    var primary = document.getElementById("primary");
    var secondary = document.getElementById("secondary");
    if (isIOS) {
      primary.textContent = "Get the App";
      primary.href = appStore;
      secondary.style.display = "block";
      secondary.textContent = "Play in browser";
      secondary.href = webUrl;
    } else {
      primary.textContent = "Play Now";
      primary.href = webUrl;
      secondary.style.display = "none";
    }
  })();
</script>
</body>
</html>
