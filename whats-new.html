<div class="wn-wrap">
  <div id="wn-list"></div>
  </div>
<script>
(function () {
  fetch("/release-notes.json").then(function (r) { return r.json(); }).then(function (d) {
    var list = document.getElementById("wn-list");
    var versions = ((d && d.versions) || []).slice(0, 20);
    function fmtDate(str) {
      try {
        var p = str.split("-");
        return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      } catch (e) { return str; }
    }
    versions.forEach(function (v) {
      var acc = document.createElement("div");
      acc.className = "wn-acc";
      var head = document.createElement("button");
      head.className = "wn-head";
      head.innerHTML = '<span class="wn-pill">v' + v.version + '</span><span class="wn-date"></span><i class="ti ti-chevron-right wn-chev" aria-hidden="true"></i>';
      head.querySelector(".wn-date").textContent = fmtDate(v.date || "");
      var body = document.createElement("div");
      body.className = "wn-body";
      var note = document.createElement("span");
      note.className = "wn-note";
      note.textContent = v.notes || "";
      body.appendChild(note);
      head.addEventListener("click", function () { acc.classList.toggle("open"); });
      acc.appendChild(head); acc.appendChild(body);
      list.appendChild(acc);
    });
  }).catch(function () {
    document.getElementById("wn-list").innerHTML = '<div class="wn-note" style="text-align:center;">Release notes are taking a break - try a refresh.</div>';
  });
})();
</script>
